[package]
name = "sc-chat"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Client core of the SoundCloud chat"

[dependencies]
sc-chat-wire = { version = "0.1.1", path = "../sc-chat-wire" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
chacha20poly1305 = "=0.10.1"
hmac = "=0.12.1"
sha2 = "0.10"
async-trait = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
uniffi = { version = "0.32", optional = true }

[features]
ffi = ["dep:uniffi"]

[dev-dependencies]
sc-chat-wire = { path = "../sc-chat-wire", features = ["vectors"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }
