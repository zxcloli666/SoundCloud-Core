[package]
name = "sc-chat-wire"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Wire format and crypto of the SoundCloud chat"

[dependencies]
blake2 = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
equix = { version = "0.8", default-features = false }
getrandom = "0.3"
hex = "0.4"
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
prost = "0.13"
sha2 = "0.10"
thiserror = "2"

[features]
vectors = []
solve = ["equix/compiler"]

[[example]]
name = "pow_bench"
required-features = ["solve"]

[build-dependencies]
prost-build = "0.13"
protox = "0.8"

[dev-dependencies]
serde_json = "1"
