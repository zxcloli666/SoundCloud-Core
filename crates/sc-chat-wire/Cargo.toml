[package]
name = "sc-chat-wire"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Wire format and crypto of the SoundCloud chat"

[dependencies]
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
getrandom = "0.3"
hex = "0.4"
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
prost = "0.13"
sha2 = "0.10"
thiserror = "2"

[build-dependencies]
prost-build = "0.13"
protox = "0.8"

[dev-dependencies]
serde_json = "1"
