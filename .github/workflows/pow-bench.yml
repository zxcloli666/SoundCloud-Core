name: pow-bench
on:
  push:
    branches: [auth/pow]
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - run: cargo run --release -p sc-chat-wire --features solve --example pow_bench
