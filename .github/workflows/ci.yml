name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          key: lint

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Tests ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      - name: Tests
        run: cargo test --workspace --all-features --locked

  mobile:
    name: Check ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            runner: ubuntu-latest
            clang: aarch64-linux-android24-clang
          - target: armv7-linux-androideabi
            runner: ubuntu-latest
            clang: armv7a-linux-androideabi24-clang
          - target: x86_64-linux-android
            runner: ubuntu-latest
            clang: x86_64-linux-android24-clang
          - target: aarch64-apple-ios
            runner: macos-latest
          - target: aarch64-apple-ios-sim
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.target }}

      - name: Android NDK
        if: matrix.clang
        env:
          TARGET: ${{ matrix.target }}
          CLANG: ${{ matrix.clang }}
        run: |
          bin="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/$CLANG"
          name="${TARGET//-/_}"
          echo "CC_$name=$bin/$CLANG" >> "$GITHUB_ENV"
          echo "AR_$name=$bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Check
        run: cargo check --workspace --all-features --locked --target ${{ matrix.target }}
